{%extends "blog/base.html" %}
{% block content %}
    {% for post in posts %}
        <article class="media content-section">
        <div class="media-body">
            <img class="rounded-circle mr-3" src="{% if user.profile.img %}{{ user.profile.img.url }}{% else %}https://api.dicebear.com/7.x/adventurer-neutral/svg?seed={{ user.username }}{% endif %}"
             alt="Author Image" style="width: 50px; height: 50px;">
            <div class="article-metadata">
                <a class="mr-2" href="{% url 'post-detail' post.id %}">{{ post.author }}</a>
                <small class="text-muted">{{ post.date_posted|date:"F d, Y " }}</small>
            </div>
            <h2><a class="article-title" href="{% url 'post-detail' post.id %}">{{ post.title }}</a></h2>
            <p class="article-  content">{{ post.content }}</p>
        </div>
        </article>
    {% endfor %}    
{% endblock content %}
